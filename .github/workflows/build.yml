name: Build AltSnap

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            mingw_sys: MINGW32
            mingw_arch: i686
            make_flags: ""
          - arch: x64
            mingw_sys: MINGW64
            mingw_arch: x86_64
            make_flags: "X64=1"
    
    steps:
    - name: Configure Git
      run: |
        git config --global core.autocrlf false
        git config --global core.eol lf

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: ${{ matrix.mingw_sys }}
        update: true
        install: >-
          base-devel
          mingw-w64-${{ matrix.mingw_arch }}-toolchain
          make

    - name: Build with MinGW
      shell: msys2 {0}
      run: |
        # Go to workspace
        cd "$GITHUB_WORKSPACE"
        
        echo "Building for ${{ matrix.arch }} using $MSYSTEM"
        gcc -dumpmachine
        
        # 1. Clean any previous artifacts to prevent "skipping incompatible" errors
        make clean || true
        
        # 2. Run the build with the specific architecture flags
        # We pass the flags twice (as env and as arguments) to ensure the Makefile picks them up
        export ${{ matrix.make_flags }}
        make ${{ matrix.make_flags }} -j$(nproc) || {
          echo "Build failed! Checking directory state..."
          ls -R
          exit 1
        }

    - name: Verify build outputs
      shell: msys2 {0}
      run: |
        echo "=== Checking architecture of generated binaries ==="
        # This confirms if we actually built 64-bit or 32-bit
        find . -maxdepth 2 -type f \( -name "*.exe" -o -name "*.dll" \) | while read file; do
          echo "File: $file"
          file "$file"
        done

    - name: Package artifacts
      shell: pwsh
      run: |
        $artifactDir = "AltSnap-${{ matrix.arch }}"
        New-Item -ItemType Directory -Force -Path $artifactDir
        
        # Copy binaries from the root (where AltSnap typically builds them)
        $binaries = Get-ChildItem -Path "." -Include *.exe,*.dll
        foreach ($file in $binaries) {
            Copy-Item $file.FullName -Destination $artifactDir -Force
        }
        
        # Copy required folders and docs
        if (Test-Path "Lang") { Copy-Item "Lang" -Destination $artifactDir -Recurse -Force }
        @("README.md", "LICENSE", "COPYING", "AltSnap.ini") | ForEach-Object {
            if (Test-Path $_) { Copy-Item $_ -Destination $artifactDir -Force }
        }
        
        if ((Get-ChildItem $artifactDir).Count -eq 0) {
            Write-Error "No files were copied to the artifact directory!"
            exit 1
        }

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: AltSnap-${{ matrix.arch }}
        path: AltSnap-${{ matrix.arch }}/

  release:
    needs: build
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: AltSnap-*
        path: artifacts

    - name: Create release archives
      shell: pwsh
      run: |
        Get-ChildItem artifacts -Directory | ForEach-Object {
          $zipName = "$($_.Name).zip"
          Compress-Archive -Path "$($_.FullName)/*" -DestinationPath $zipName -Force
        }

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: AltSnap-*.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
