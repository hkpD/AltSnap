name: Build AltSnap

# Controls when the workflow will run
on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  # Also runs automatically whenever you push code to the main/master branch
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      # 1. Download your repository code into the runner
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup GCC + MinGW-w64 (WinLibs)
      # GitHub's Windows runner comes with MinGW, but Strawberry Perl often conflicts with it.
      # This step removes Perl from the PATH and ensures the latest WinLibs MinGW is used.
      - name: Setup MinGW-w64 (WinLibs)
        shell: pwsh
        run: |
          choco upgrade mingw -y
          # Put MinGW at the very front of the system PATH to avoid conflicts
          echo "C:\ProgramData\mingw64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # 3. Verify the compiler is working
      - name: Verify GCC version
        run: |
          gcc --version
          mingw32-make --version

      # 4. Build AltSnap using the Makefile
      - name: Build AltSnap
        run: mingw32-make -j4

      # 5. Package the built files so you can download them
      - name: Upload Built Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AltSnap-Build-x64
          path: |
            *.exe
            *.dll
            *.ini
            *.txt
            *.manifest
            Lang/
          if-no-files-found: error
