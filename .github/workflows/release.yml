name: Build AltSnap

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  # Optionally trigger manually
  workflow_dispatch:

jobs:

  build-i386:
    name: Build i386 (Win32)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install MinGW-w64 (i686)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-i686 binutils-mingw-w64-i686

      - name: Build (i386)
        run: make -f Makefile

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AltSnap-i386
          path: |
            AltSnap.exe
            hooks.dll

  build-x64:
    name: Build x86_64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install MinGW-w64 (x86_64)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64

      - name: Build (x64)
        run: make -f MakefileX64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AltSnap-x64
          path: |
            AltSnap.exe
            hooks.dll
