name: Build AltSnap

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86
            msystem: MINGW32
            makefile: Makefile
            artifact: altsnap-x86
          - name: x64
            msystem: MINGW64
            makefile: MakefileX64
            artifact: altsnap-x64

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            make
            mingw-w64-${{ matrix.msystem == 'MINGW32' && 'i686' || 'x86_64' }}-gcc
            mingw-w64-${{ matrix.msystem == 'MINGW32' && 'i686' || 'x86_64' }}-binutils

      - name: Build
        run: make -f ${{ matrix.makefile }}

      - name: Prepare portable package
        shell: pwsh
        run: |
          $dir = "dist/${{ matrix.artifact }}"
          New-Item -ItemType Directory -Force -Path $dir, "$dir/Lang" | Out-Null
          Copy-Item AltSnap.exe, hooks.dll, AltSnap.txt, AltSnap.xml, License.txt $dir
          Copy-Item AltSnap.dni "$dir/AltSnap.ini"
          if (Test-Path Lang) { Copy-Item Lang\* "$dir/Lang\" -Recurse -ErrorAction SilentlyContinue }
          # optional extras often shipped
          if (Test-Path sch_On.bat) { Copy-Item sch_On.bat, sch_Off.bat $dir -ErrorAction SilentlyContinue }
          if (Test-Path Themes) { Copy-Item Themes $dir -Recurse -ErrorAction SilentlyContinue }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}/
          if-no-files-found: error
