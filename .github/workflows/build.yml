name: Build AltSnap

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            mingw_sys: MINGW32
            mingw_arch: i686
          - arch: x64
            mingw_sys: MINGW64
            mingw_arch: x86_64
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: ${{ matrix.mingw_sys }}
        install: >-
          base-devel
          mingw-w64-${{ matrix.mingw_arch }}-toolchain
          make

    - name: Build AltSnap
      shell: msys2 {0}
      run: |
        # Ensure we are in the workspace
        cd "$GITHUB_WORKSPACE"
        
        # Clean any old objects
        make clean || true

        if [ "${{ matrix.arch }}" = "x64" ]; then
          echo "Applying x64 patches to Makefile..."
          
          # 1. Remove 32-bit flags
          sed -i 's/-m32//g' Makefile
          sed -i 's/-march=i386//g' Makefile
          sed -i 's/-mtune=i686//g' Makefile
          sed -i 's/-mpreferred-stack-boundary=2//g' Makefile
          
          # 2. Fix 64-bit Entry Points (Remove leading underscores and @nn decorations)
          # _unfuckWinMain@0 -> unfuckWinMain
          # _DllMain@12 -> DllMain
          sed -i 's/_unfuckWinMain@0/unfuckWinMain/g' Makefile
          sed -i 's/_DllMain@12/DllMain/g' Makefile
          
          # 3. Ensure -m64 is used
          echo "Building with X64=1..."
          make X64=1 -j$(nproc)
        else
          echo "Building for x86..."
          make -j$(nproc)
        fi

    - name: Verify Architecture
      shell: msys2 {0}
      run: |
        echo "Verifying binary types:"
        find . -maxdepth 1 -type f \( -name "*.exe" -o -name "*.dll" \) -exec file {} \;

    - name: Package artifacts
      shell: pwsh
      run: |
        $dir = "AltSnap-${{ matrix.arch }}"
        New-Item -ItemType Directory -Force -Path $dir
        
        # Copy binaries
        Get-ChildItem -Path "." -Include *.exe,*.dll | Copy-Item -Destination $dir -Force
        
        # Copy Assets
        if (Test-Path "Lang") { Copy-Item "Lang" -Destination $dir -Recurse -Force }
        @("README.md", "LICENSE", "COPYING", "AltSnap.ini") | ForEach-Object {
          if (Test-Path $_) { Copy-Item $_ -Destination $dir -Force }
        }
        
        # Simple check to ensure we actually built something
        if ((Get-ChildItem $dir/*.exe).Count -eq 0) { 
          Write-Error "Build failed to produce .exe files"
          exit 1 
        }

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: AltSnap-${{ matrix.arch }}
        path: AltSnap-${{ matrix.arch }}/

  release:
    needs: build
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: AltSnap-*
        path: artifacts
    - name: Create release archives
      shell: pwsh
      run: |
        Get-ChildItem artifacts -Directory | ForEach-Object {
          Compress-Archive -Path "$($_.FullName)/*" -DestinationPath "$($_.Name).zip" -Force
        }
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: AltSnap-*.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
