name: Build AltSnap

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    strategy:
      matrix:
        arch: [x86, x64]
        include:
          - arch: x86
            msvc_arch: x86
            mingw_arch: i686
            mingw_prefix: mingw32
          - arch: x64
            msvc_arch: x64
            mingw_arch: x86_64
            mingw_prefix: mingw64
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW${{ matrix.arch == 'x64' && '64' || '32' }}
        update: true
        install: >-
          base-devel
          mingw-w64-${{ matrix.mingw_arch }}-toolchain
          mingw-w64-${{ matrix.mingw_arch }}-gcc
          make

    - name: Build with MinGW
      shell: msys2 {0}
      run: |
        cd "$GITHUB_WORKSPACE"
        
        # Check if Makefile exists and show build info
        ls -la
        
        # Try to build - adjust based on actual build system
        if [ -f "Makefile" ]; then
          make clean || true
          make -j$(nproc) || make
        elif [ -f "build.sh" ]; then
          bash build.sh
        elif [ -f "buildgcc.bat" ]; then
          cmd //c buildgcc.bat ${{ matrix.arch }}
        else
          # Manual compilation if no build script found
          echo "Looking for source files..."
          find . -name "*.c" -o -name "*.cpp"
          
          # Attempt manual build
          gcc -o AltSnap.exe *.c -lgdi32 -luser32 -lkernel32 || \
          g++ -o AltSnap.exe *.cpp -lgdi32 -luser32 -lkernel32
        fi

    - name: List build artifacts
      shell: msys2 {0}
      run: |
        echo "Build directory contents:"
        find . -type f \( -name "*.exe" -o -name "*.dll" \) -ls

    - name: Prepare artifacts
      shell: pwsh
      run: |
        $artifactDir = "AltSnap-${{ matrix.arch }}"
        New-Item -ItemType Directory -Force -Path $artifactDir
        
        # Find and copy executables and DLLs
        Get-ChildItem -Recurse -Include *.exe,*.dll | Where-Object { 
          $_.DirectoryName -notlike "*\.git*" 
        } | ForEach-Object {
          Write-Host "Found: $($_.FullName)"
          Copy-Item $_.FullName $artifactDir -Force
        }
        
        # Copy documentation
        @("README.md", "LICENSE", "COPYING", "readme.txt") | ForEach-Object {
          if (Test-Path $_) { Copy-Item $_ $artifactDir -Force }
        }
        
        # Copy language files if they exist
        if (Test-Path "Lang") { 
          Copy-Item "Lang" $artifactDir -Recurse -Force
        }
        
        # List what we're uploading
        Write-Host "`nArtifacts to upload:"
        Get-ChildItem $artifactDir -Recurse

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: AltSnap-${{ matrix.arch }}
        path: AltSnap-${{ matrix.arch }}/
        if-no-files-found: warn

  release:
    needs: build
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - name: Download x86 artifacts
      uses: actions/download-artifact@v4
      with:
        name: AltSnap-x86
        path: release/x86

    - name: Download x64 artifacts
      uses: actions/download-artifact@v4
      with:
        name: AltSnap-x64
        path: release/x64

    - name: Create release archives
      shell: pwsh
      run: |
        Compress-Archive -Path release/x86/* -DestinationPath AltSnap-x86.zip
        Compress-Archive -Path release/x64/* -DestinationPath AltSnap-x64.zip

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          AltSnap-x86.zip
          AltSnap-x64.zip
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
