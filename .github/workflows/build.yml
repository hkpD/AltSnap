name: Build AltSnap

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            mingw_arch: i686
            mingw_sys: MINGW32
            msystem_prefix: mingw32
          - arch: x64
            mingw_arch: x86_64
            mingw_sys: MINGW64
            msystem_prefix: mingw64
    
    steps:
    - name: Configure Git
      run: |
        git config --global core.autocrlf false
        git config --global core.eol lf
        git config --global core.safecrlf false

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: ${{ matrix.mingw_sys }}
        update: false
        install: >-
          base-devel
          mingw-w64-${{ matrix.mingw_arch }}-toolchain
          mingw-w64-${{ matrix.mingw_arch }}-gcc
          mingw-w64-${{ matrix.mingw_arch }}-binutils
          make

    - name: Verify toolchain
      shell: msys2 {0}
      run: |
        echo "=== Compiler Info ==="
        which gcc
        gcc --version
        gcc -dumpmachine
        
        echo "=== Available libraries ==="
        ls /${{ matrix.msystem_prefix }}/lib/*.a | head -20
        
        echo "=== Environment ==="
        echo "PATH=$PATH"
        echo "MSYSTEM=$MSYSTEM"

    - name: Build with MinGW
      shell: msys2 {0}
      env:
        MSYSTEM: ${{ matrix.mingw_sys }}
      run: |
        cd "$GITHUB_WORKSPACE"
        
        echo "Current directory: $(pwd)"
        echo "Building for ${{ matrix.arch }}"
        
        # Clean previous builds
        make clean 2>/dev/null || true
        
        # Build - the Makefile should detect the correct architecture from MSYSTEM
        make -j$(nproc) 2>&1 | tee build.log || {
          echo "=== Build failed, showing last 50 lines of build log ==="
          tail -50 build.log
          exit 1
        }

    - name: Verify build outputs
      shell: msys2 {0}
      run: |
        echo "=== Build outputs ==="
        find . -type f \( -name "*.exe" -o -name "*.dll" \) ! -path "*/.git/*" -exec ls -lh {} \;
        
        echo "=== Checking file types ==="
        find . -type f \( -name "*.exe" -o -name "*.dll" \) ! -path "*/.git/*" -exec file {} \;

    - name: Package artifacts
      shell: pwsh
      run: |
        $artifactDir = "AltSnap-${{ matrix.arch }}"
        New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null
        
        # Find and copy executables and DLLs
        $files = Get-ChildItem -Recurse -Include *.exe,*.dll | Where-Object { 
          $_.DirectoryName -notmatch '\\.git' -and 
          $_.DirectoryName -notmatch 'msys64'
        }
        
        if ($files.Count -eq 0) {
          Write-Error "No build outputs found!"
          exit 1
        }
        
        foreach ($file in $files) {
          Write-Host "Copying: $($file.Name) from $($file.DirectoryName)"
          Copy-Item $file.FullName -Destination $artifactDir -Force
        }
        
        # Copy documentation
        @("README.md", "LICENSE", "COPYING") | ForEach-Object {
          if (Test-Path $_) {
            Write-Host "Copying: $_"
            Copy-Item $_ -Destination $artifactDir -Force
          }
        }
        
        # Copy text files
        Get-ChildItem "*.txt" -ErrorAction SilentlyContinue | ForEach-Object {
          Write-Host "Copying: $($_.Name)"
          Copy-Item $_.FullName -Destination $artifactDir -Force
        }
        
        # Copy Lang directory if it exists
        if (Test-Path "Lang") {
          Write-Host "Copying Lang directory"
          Copy-Item "Lang" -Destination $artifactDir -Recurse -Force
        }
        
        # Show what we're uploading
        Write-Host "`n=== Artifacts to upload ==="
        Get-ChildItem $artifactDir -Recurse | ForEach-Object {
          Write-Host $_.FullName
        }

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: AltSnap-${{ matrix.arch }}
        path: AltSnap-${{ matrix.arch }}/

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log-${{ matrix.arch }}
        path: build.log
        if-no-files-found: ignore

  release:
    needs: build
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: AltSnap-*
        path: artifacts
        merge-multiple: false

    - name: Create release archives
      shell: pwsh
      run: |
        Get-ChildItem artifacts -Directory | ForEach-Object {
          $zipName = "$($_.Name).zip"
          Write-Host "Creating $zipName"
          Compress-Archive -Path "$($_.FullName)/*" -DestinationPath $zipName
        }
        
        Write-Host "`nRelease files:"
        Get-ChildItem *.zip

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: AltSnap-*.zip
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
