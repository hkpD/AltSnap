name: Build AltSnap

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install MinGW-w64 GCC
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            make

      - name: Build AltSnap
        shell: msys2 {0}
        run: |
          gcc --version
          make

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: AltSnap-windows-x64
          path: |
            **/*.exe
            **/*.dll
          if-no-files-found: error
