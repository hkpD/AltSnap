name: Build AltSnap for Windows x64

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-x64:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Install MinGW-w64 toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y mingw-w64 make
        
    - name: Verify toolchain installation
      run: |
        x86_64-w64-mingw32-gcc --version
        make --version
        
    - name: Build AltSnap for x64
      run: |
        make
        
    - name: Verify build outputs
      run: |
        ls -lh AltSnap.exe hooks.dll
        file AltSnap.exe hooks.dll
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: altsnap-windows-x64
        path: |
          AltSnap.exe
          hooks.dll
        retention-days: 30
        
    - name: Create release (on tag)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          AltSnap.exe
          hooks.dll
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
