name: Build AltSnap

on:
  push:
    branches: [ master, main, develop ]
    tags: [ "*" ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            msystem: MINGW32
            mingw_arch: i686
          - arch: x64
            msystem: MINGW64
            mingw_arch: x86_64

    steps:
      - name: Configure Git
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
          git config --global core.safecrlf false

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          path-type: minimal
          install: >-
            base-devel
            make
            mingw-w64-${{ matrix.mingw_arch }}-toolchain

      - name: Show toolchain
        shell: msys2 {0}
        run: |
          set -euxo pipefail
          echo "MSYSTEM=$MSYSTEM"
          which gcc
          gcc -dumpmachine
          gcc --version
          which windres
          windres --version

      - name: Patch Makefile for x64
        if: matrix.arch == 'x64'
        shell: msys2 {0}
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE"

          echo "=== Makefile architecture flags before patch ==="
          grep -nE -- "-m32|-m64|-march=|-mtune=|-mpreferred-stack-boundary|-mno-stack-arg-probe|-e_|-eDllMain|-eunfuckWinMain|pe-i386|pe-x86-64" Makefile || true

          sed -i \
            -e 's/-m32/-m64/g' \
            -e 's/-march=i386//g' \
            -e 's/-mtune=i686//g' \
            -e 's/-mpreferred-stack-boundary=2//g' \
            -e 's/-mno-stack-arg-probe//g' \
            -e 's/-e_DllMain@12/-eDllMain/g' \
            -e 's/-e_unfuckWinMain@0/-eunfuckWinMain/g' \
            -e 's/pe-i386/pe-x86-64/g' \
            Makefile

          echo "=== Makefile architecture flags after patch ==="
          grep -nE -- "-m32|-m64|-march=|-mtune=|-mpreferred-stack-boundary|-mno-stack-arg-probe|-e_|-eDllMain|-eunfuckWinMain|pe-i386|pe-x86-64" Makefile || true

      - name: Build with MinGW
        shell: msys2 {0}
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE"

          echo "Building AltSnap for ${{ matrix.arch }}"
          echo "MSYSTEM=$MSYSTEM"
          gcc -dumpmachine

          make clean || true
          make -j"$(nproc)" 2>&1 | tee build.log

      - name: Verify build outputs
        shell: msys2 {0}
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE"

          echo "=== Build outputs ==="
          find . -type f \( -name "*.exe" -o -name "*.dll" \) \
            ! -path "*/.git/*" \
            ! -path "*/msys64/*" \
            -exec ls -lh {} \;

          echo ""
          echo "=== Checking architecture of binaries ==="
          find . -type f \( -name "*.exe" -o -name "*.dll" \) \
            ! -path "*/.git/*" \
            ! -path "*/msys64/*" | while read -r file; do
              echo "File: $file"
              file "$file"
              objdump -f "$file" 2>/dev/null | grep -E "architecture|file format" || true
              echo ""
            done

      - name: Package artifacts
        shell: pwsh
        run: |
          $artifactDir = "AltSnap-${{ matrix.arch }}"
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null

          $artifactFullPath = (Resolve-Path $artifactDir).Path

          $files = Get-ChildItem -Recurse -Include *.exe,*.dll | Where-Object {
            $_.DirectoryName -notmatch '\\.git' -and
            $_.DirectoryName -notmatch 'msys64' -and
            $_.DirectoryName -notmatch '_temp' -and
            $_.DirectoryName -ne $artifactFullPath
          }

          if ($files.Count -eq 0) {
            Write-Error "No build outputs found!"
            Get-ChildItem -Recurse | Select-Object FullName | Out-String | Write-Host
            exit 1
          }

          foreach ($file in $files) {
            Write-Host "Copying: $($file.FullName)"
            Copy-Item $file.FullName -Destination $artifactDir -Force
          }

          @("README.md", "LICENSE", "COPYING") | ForEach-Object {
            if (Test-Path $_) {
              Copy-Item $_ -Destination $artifactDir -Force
            }
          }

          Get-ChildItem "*.txt" -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item $_.FullName -Destination $artifactDir -Force
          }

          if (Test-Path "Lang") {
            Copy-Item "Lang" -Destination $artifactDir -Recurse -Force
          }

          Write-Host "`n=== Final artifact contents ==="
          Get-ChildItem $artifactDir -Recurse

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AltSnap-${{ matrix.arch }}
          path: AltSnap-${{ matrix.arch }}/

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.arch }}
          path: build.log
          if-no-files-found: ignore

  release:
    needs: build
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: AltSnap-*
          path: artifacts

      - name: List downloaded artifacts
        shell: pwsh
        run: |
          Write-Host "Downloaded artifacts:"
          Get-ChildItem artifacts -Recurse

      - name: Create release archives
        shell: pwsh
        run: |
          Get-ChildItem artifacts -Directory | Where-Object { $_.Name -like "AltSnap-*" } | ForEach-Object {
            $zipName = "$($_.Name).zip"
            Write-Host "Creating $zipName from $($_.FullName)"
            Compress-Archive -Path "$($_.FullName)/*" -DestinationPath $zipName -Force
          }

          Write-Host "`nRelease archives created:"
          Get-ChildItem *.zip | ForEach-Object {
            Write-Host "$($_.Name) - $($_.Length) bytes"
          }

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: AltSnap-*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
