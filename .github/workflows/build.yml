# This workflow compiles the AltSnap project for Windows x86 and x64 platforms.

name: Build AltSnap

# Controls when the workflow will run
on:
  # Triggers the workflow on push events but only for the "master" branch
  push:
    branches: [ "master" ]
  # Triggers the workflow on pull request events
  pull_request:
    branches: [ "master" ]

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  build-windows:
    # The type of runner that the job will run on
    runs-on: windows-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Step 1: Check out the repository's code
      # The `submodules: 'recursive'` part is CRITICAL. AltSnap uses a git submodule
      # for libmsstyle, and without this, the compilation will fail.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      # Step 2: Set up the MSBuild environment.
      # This action finds the path to MSBuild.exe and adds it to the system's PATH.
      # This makes the `msbuild` command available in subsequent steps.
      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2

      # Step 3: Build the x64 (64-bit) version of the solution.
      # We call msbuild.exe directly on the solution file.
      # /p:Configuration=Release specifies the build configuration.
      # /p:Platform=x64 specifies the target architecture.
      - name: Build x64 Solution
        run: msbuild.exe /p:Configuration=Release /p:Platform=x64 AltSnap.sln

      # Step 4: Build the x86 (32-bit) version of the solution.
      # The platform name for 32-bit in this solution is 'x86'.
      - name: Build x86 Solution
        run: msbuild.exe /p:Configuration=Release /p:Platform=x86 AltSnap.sln

      # Step 5: Upload the compiled binaries as an artifact.
      # This gathers the important output files from the build and packages them
      # into a single zip file called "altsnap-binaries". This file can be
      # downloaded from the workflow run's summary page.
      - name: Upload binaries artifact
        uses: actions/upload-artifact@v4
        with:
          name: altsnap-binaries
          path: |
            x64/Release/AltSnap.exe
            x64/Release/AltSnap.dll
            Win32/Release/AltSnap.exe
            Win32/Release/AltSnap.dll
