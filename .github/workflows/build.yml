name: Build AltSnap

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            mingw_sys: MINGW32
            mingw_arch: i686
            make_target: ""
          - arch: x64
            mingw_sys: MINGW64
            mingw_arch: x86_64
            make_target: "X64=1"
    
    steps:
    - name: Configure Git
      run: |
        git config --global core.autocrlf false
        git config --global core.eol lf
        git config --global core.safecrlf false

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: ${{ matrix.mingw_sys }}
        update: false
        install: >-
          base-devel
          mingw-w64-${{ matrix.mingw_arch }}-toolchain
          make

    - name: Check Makefile
      shell: msys2 {0}
      run: |
        echo "=== Checking Makefile for build targets ==="
        if [ -f Makefile ]; then
          grep -E "^[a-zA-Z0-9_-]+:" Makefile | head -20 || true
          echo ""
          echo "=== Checking for X64/x64/64 references ==="
          grep -i "x64\|64bit\|win64" Makefile || echo "No x64 references found"
        fi

    - name: Build with MinGW
      shell: msys2 {0}
      run: |
        cd "$GITHUB_WORKSPACE"
        
        echo "Building for ${{ matrix.arch }}"
        echo "MSYSTEM: $MSYSTEM"
        gcc -dumpmachine
        
        # Clean
        make clean 2>/dev/null || true
        
        # Try different build approaches
        if [ "${{ matrix.arch }}" = "x64" ]; then
          echo "=== Attempting x64 build ==="
          # Try various x64 build flags that might work
          make ${{ matrix.make_target }} -j$(nproc) 2>&1 | tee build.log && exit 0
          make X64=1 -j$(nproc) 2>&1 | tee build.log && exit 0
          make x64 -j$(nproc) 2>&1 | tee build.log && exit 0
          make WIN64=1 -j$(nproc) 2>&1 | tee build.log && exit 0
          make ARCH=x64 -j$(nproc) 2>&1 | tee build.log && exit 0
          make -j$(nproc) 2>&1 | tee build.log || {
            echo "Build failed, showing errors:"
            tail -100 build.log
            exit 1
          }
        else
          echo "=== Attempting x86 build ==="
          make -j$(nproc) 2>&1 | tee build.log || {
            echo "Build failed, showing errors:"
            tail -100 build.log
            exit 1
          }
        fi

    - name: Verify build outputs
      shell: msys2 {0}
      run: |
        echo "=== Build outputs ==="
        find . -type f \( -name "*.exe" -o -name "*.dll" \) ! -path "*/.git/*" ! -path "*/msys64/*" -exec ls -lh {} \;
        
        echo ""
        echo "=== Checking architecture of binaries ==="
        find . -type f \( -name "*.exe" -o -name "*.dll" \) ! -path "*/.git/*" ! -path "*/msys64/*" | while read file; do
          echo "File: $file"
          file "$file"
          # Check PE header for architecture
          objdump -f "$file" 2>/dev/null | grep -E "architecture|file format" || true
          echo ""
        done

    - name: Package artifacts
      shell: pwsh
      run: |
        $artifactDir = "AltSnap-${{ matrix.arch }}"
        New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null
        
        # Find and copy executables and DLLs (excluding MSYS2 system files)
        $files = Get-ChildItem -Recurse -Include *.exe,*.dll | Where-Object { 
          $_.DirectoryName -notmatch '\\.git' -and 
          $_.DirectoryName -notmatch 'msys64' -and
          $_.DirectoryName -notmatch '_temp'
        }
        
        if ($files.Count -eq 0) {
          Write-Error "No build outputs found!"
          Get-ChildItem -Recurse | Select-Object FullName | Out-String | Write-Host
          exit 1
        }
        
        foreach ($file in $files) {
          Write-Host "Copying: $($file.Name)"
          Copy-Item $file.FullName -Destination $artifactDir -Force
        }
        
        # Copy documentation
        @("README.md", "LICENSE", "COPYING") | ForEach-Object {
          if (Test-Path $_) {
            Copy-Item $_ -Destination $artifactDir -Force
          }
        }
        
        Get-ChildItem "*.txt" -ErrorAction SilentlyContinue | ForEach-Object {
          Copy-Item $_.FullName -Destination $artifactDir -Force
        }
        
        # Copy Lang directory
        if (Test-Path "Lang") {
          Copy-Item "Lang" -Destination $artifactDir -Recurse -Force
        }
        
        Write-Host "`n=== Final artifact contents ==="
        Get-ChildItem $artifactDir -Recurse

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: AltSnap-${{ matrix.arch }}
        path: AltSnap-${{ matrix.arch }}/

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log-${{ matrix.arch }}
        path: build.log
        if-no-files-found: ignore

  release:
    needs: build
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: AltSnap-*
        path: artifacts

    - name: List downloaded artifacts
      shell: pwsh
      run: |
        Write-Host "Downloaded artifacts:"
        Get-ChildItem artifacts -Recurse

    - name: Create release archives
      shell: pwsh
      run: |
        Get-ChildItem artifacts -Directory | Where-Object { $_.Name -like "AltSnap-*" } | ForEach-Object {
          $zipName = "$($_.Name).zip"
          Write-Host "Creating $zipName from $($_.FullName)"
          Compress-Archive -Path "$($_.FullName)/*" -DestinationPath $zipName -Force
        }
        
        Write-Host "`nRelease archives created:"
        Get-ChildItem *.zip | ForEach-Object { Write-Host "$($_.Name) - $($_.Length) bytes" }

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: AltSnap-*.zip
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
