name: Build AltSnap x64

on:
  workflow_dispatch: # Allows you to click the button to run it manually

jobs:
  build-x64:
    name: Build Windows x64
    runs-on: windows-latest # Use a standard Windows cloud machine

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Installs the standard Windows compiling tools (MinGW/MSYS2)
      - name: Setup Windows Build Environment
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make
            mingw-w64-x86_64-gcc

      # Compiles the .exe and .dll
      - name: Build AltSnap for x64
        shell: msys2 {0}
        run: |
          make

      # Uploads the finished files so you can download them
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AltSnap-x64-Build
          path: |
            AltSnap.exe
            hooks.dll
          if-no-files-found: error
