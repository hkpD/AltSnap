name: Build AltSnap

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            mingw_arch: i686
            mingw_sys: MINGW32
          - arch: x64
            mingw_arch: x86_64
            mingw_sys: MINGW64
    
    steps:
    - name: Configure Git
      run: |
        git config --global core.autocrlf false
        git config --global core.eol lf
        git config --global core.safecrlf false

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: ${{ matrix.mingw_sys }}
        update: false
        install: >-
          base-devel
          mingw-w64-${{ matrix.mingw_arch }}-toolchain
          mingw-w64-${{ matrix.mingw_arch }}-gcc
          make
          git

    - name: Show build environment
      shell: msys2 {0}
      run: |
        echo "Current directory:"
        pwd
        ls -la
        echo "GCC version:"
        gcc --version
        echo "Make version:"
        make --version

    - name: Build with MinGW
      shell: msys2 {0}
      run: |
        # Convert Windows paths to MSYS paths
        cd "$GITHUB_WORKSPACE"
        
        # Clean previous builds
        make clean 2>/dev/null || true
        
        # Build
        if [ "${{ matrix.arch }}" = "x86" ]; then
          make ARCH=Win32 -j$(nproc) || make ARCH=Win32 || make
        else
          make ARCH=x64 -j$(nproc) || make ARCH=x64 || make
        fi

    - name: Verify build outputs
      shell: msys2 {0}
      run: |
        echo "=== Executables and DLLs ==="
        find . -name "*.exe" -o -name "*.dll" | grep -v ".git"
        
        echo "=== File details ==="
        find . \( -name "*.exe" -o -name "*.dll" \) -exec ls -lh {} \;

    - name: Package artifacts
      shell: pwsh
      run: |
        $artifactDir = "AltSnap-${{ matrix.arch }}"
        New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null
        
        # Copy build outputs
        $files = Get-ChildItem -Recurse -Include *.exe,*.dll | Where-Object { 
          $_.DirectoryName -notmatch '\\.git'
        }
        
        if ($files.Count -eq 0) {
          Write-Warning "No build outputs found!"
          exit 1
        }
        
        foreach ($file in $files) {
          Write-Host "Copying: $($file.Name)"
          Copy-Item $file.FullName -Destination $artifactDir -Force
        }
        
        # Copy additional files
        @("README.md", "LICENSE", "COPYING", "*.txt") | ForEach-Object {
          Get-ChildItem $_ -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item $_.FullName -Destination $artifactDir -Force
          }
        }
        
        # Copy Lang directory
        if (Test-Path "Lang") {
          Copy-Item "Lang" -Destination $artifactDir -Recurse -Force
        }

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: AltSnap-${{ matrix.arch }}
        path: AltSnap-${{ matrix.arch }}/

  release:
    needs: build
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Create release archives
      shell: pwsh
      run: |
        Compress-Archive -Path artifacts/AltSnap-x86/* -DestinationPath AltSnap-x86.zip
        Compress-Archive -Path artifacts/AltSnap-x64/* -DestinationPath AltSnap-x64.zip

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          AltSnap-*.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
